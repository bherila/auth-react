name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: React package (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24.15.0', '26']
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify candidate identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit --audit-level low

      - name: Pack and verify installed ESM/CJS/type consumers
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          pnpm verify-package "$RUNNER_TEMP"/bwh-auth-*.tgz

      - name: Retain verified package
        uses: actions/upload-artifact@v7
        with:
          name: bwh-auth-node-${{ matrix.node }}
          path: ${{ runner.temp }}/bwh-auth-*.tgz
          if-no-files-found: error

  test:
    name: React package (bwh-auth)
    needs: verify
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 1
    steps:
      - name: Require all supported Node lanes
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
