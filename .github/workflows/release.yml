name: Release

on:
  push:
    tags:
      - 'bwh-auth-v*'

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify signed release tag
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: Require a verified annotated tag signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')"
          test "${verified}" = "true"

  npm:
    name: Publish bwh-auth to npm
    needs: verify-tag
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    environment: prod
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Pack tarball
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "$RUNNER_TEMP"/*.tgz \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated release of ${GITHUB_REF_NAME}."
